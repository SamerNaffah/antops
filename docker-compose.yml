version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: antops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-antops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./docker/postgres/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql
    # Postgres is reachable from other containers via the `antops-network`
    # bridge — it does NOT need to be exposed on the host. If you want to
    # connect with a local psql client for debugging, uncomment below.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antops-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: antops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-antops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - antops-network

  # MinIO Client (mc) - Initialize buckets
  minio-init:
    image: minio/mc:latest
    container_name: antops-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-antops} ${MINIO_ROOT_PASSWORD};
      mc mb minio/antops-files --ignore-existing;
      mc anonymous set download minio/antops-files;
      exit 0;
      "
    networks:
      - antops-network

  # Redis (Optional - for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: antops-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-antops}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antops-network

  # ANTOPS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antops-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-antops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-antops}

      # NextAuth
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # MinIO Storage
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-antops}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: antops-files

      # Redis (Optional)
      REDIS_URL: redis://:${REDIS_PASSWORD:-antops}@redis:6379

      # AI Provider (Optional - choose one or both)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Application Settings
      NODE_ENV: production
      PORT: 3000

      # Feature Flags
      ENABLE_AI_FEATURES: ${ENABLE_AI_FEATURES:-true}
      ENABLE_INTEGRATIONS: ${ENABLE_INTEGRATIONS:-true}
    ports:
      - "3000:3000"
    volumes:
      # Mount for logs (optional)
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - antops-network

  # Nginx Reverse Proxy (Optional - for production)
  # Uncomment if you want SSL/TLS termination and better performance
  # nginx:
  #   image: nginx:alpine
  #   container_name: antops-nginx
  #   restart: unless-stopped
  #   depends_on:
  #     - app
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./docker/nginx/ssl:/etc/nginx/ssl:ro
  #   networks:
  #     - antops-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  antops-network:
    driver: bridge
